name: Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest

    steps:
      - name: Ping health endpoint
        shell: bash
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://avelixlink.com/health)
          echo "HTTP status: ${STATUS_CODE}"
          test "${STATUS_CODE}" -ge 200 -a "${STATUS_CODE}" -lt 400
